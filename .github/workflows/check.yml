name: Check package
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: yes
      APP_ENV: development
      STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: '4.5.1'
      - uses: r-lib/actions/setup-renv@v2
      - name: Test application
        run: Rscript --vanilla scripts/check.R
      - name: Check Connect Cloud deployment bundle
        run: Rscript --vanilla scripts/check_deployment.R
      - name: Build and check installed package
        run: Rscript --vanilla scripts/build_and_check.R
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser scripts
        run: node --test tests/js/form-state.test.cjs tests/js/workbook-downloads.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-check
          path: rosoyster.Rcheck
